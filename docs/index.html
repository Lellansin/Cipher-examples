<script>
// ============ 算法实现（与仓库各语言示例逻辑一致） ============

// 凯撒密码: 字母整体位移
function caesar(text, shift) {
  return text.replace(/[a-zA-Z]/g, function (ch) {
    var base = ch <= 'Z' ? 65 : 97;
    return String.fromCharCode((ch.charCodeAt(0) - base + shift + 26 * 10) % 26 + base);
  });
}

// ROT13: 位移 13 的凯撒, 自反
function rot13(text) { return caesar(text, 13); }

// 埃特巴什: 字母表倒序映射, 自反
function atbash(text) {
  return text.replace(/[a-zA-Z]/g, function (ch) {
    var base = ch <= 'Z' ? 65 : 97;
    return String.fromCharCode(base + 25 - (ch.charCodeAt(0) - base));
  });
}

// 维吉尼亚: 密钥字母逐位位移
function vigenere(text, key, dir) {
  key = key.toUpperCase().replace(/[^A-Z]/g, '') || 'A';
  var count = 0;
  return text.replace(/[a-zA-Z]/g, function (ch) {
    var base = ch <= 'Z' ? 65 : 97;
    var shift = key.charCodeAt(count++ % key.length) - 65;
    return String.fromCharCode((ch.charCodeAt(0) - base + dir * shift + 26 * 10) % 26 + base);
  });
}

// 栅栏密码: W 形书写按栏读出
function railfence(text, rails, decrypt) {
  if (rails < 2) return text;
  var pattern = [], rail = 0, step = 1, i;
  for (i = 0; i < text.length; i++) {
    pattern.push(rail);
    if (rail === 0) step = 1; else if (rail === rails - 1) step = -1;
    rail += step;
  }
  if (!decrypt) {
    var fence = []; for (i = 0; i < rails; i++) fence.push([]);
    for (i = 0; i < text.length; i++) fence[pattern[i]].push(text[i]);
    return fence.map(function (row) { return row.join(''); }).join('');
  }
  var rows = [], idx = 0, out = '';
  for (i = 0; i < rails; i++) {
    var n = pattern.filter(function (r) { return r === i; }).length;
    rows.push(text.slice(idx, idx + n).split('')); idx += n;
  }
  for (i = 0; i < text.length; i++) out += rows[pattern[i]].shift();
  return out;
}

// 密码棒: 每行 n 个字母写成矩形, 逐列读出
function scytale(text, n, decrypt) {
  if (n < 2) return text;
  if (!decrypt) {
    var out = '';
    for (var col = 0; col < n; col++)
      for (var i = col; i < text.length; i += n) out += text[i];
    return out;
  }
  var len = text.length, result = new Array(len), idx = 0;
  for (var c = 0; c < n; c++) {
    var count = Math.floor((len - c + n - 1) / n);
    for (var k = 0; k < count && idx + k < len; k++) result[c + k * n] = text[idx + k];
    idx += count;
  }
  return result.join('');
}

// 列置换: 密钥字母字典序决定读列顺序
function columnar(text, key, decrypt) {
  key = key.toUpperCase().replace(/[^A-Z]/g, '') || 'A';
  var n = key.length;
  var order = key.split('').map(function (ch, i) { return [ch, i]; })
    .sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] - b[1]; })
    .map(function (p) { return p[1]; });
  var i, out;
  if (!decrypt) {
    out = '';
    order.forEach(function (col) {
      for (i = col; i < text.length; i += n) out += text[i];
    });
    return out;
  }
  var rows = Math.ceil(text.length / n);
  var counts = [], result = new Array(text.length), idx = 0;
  for (i = 0; i < n; i++) counts.push(Math.floor((text.length - i + n - 1) / n));
  order.forEach(function (col) {
    var chunk = text.slice(idx, idx + counts[col]);
    for (var k = 0; k < chunk.length; k++) result[col + k * n] = chunk[k];
    idx += counts[col];
  });
  return result.join('');
}

// 带密钥凯撒: 密钥混合字母表再整体位移
function keyedCaesar(text, key, shift, decrypt) {
  var A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var mixed = '';
  (key.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
    if (mixed.indexOf(ch) < 0) mixed += ch;
  });
  for (var i = 0; i < 26; i++) if (mixed.indexOf(A[i]) < 0) mixed += A[i];
  shift = ((shift % 26) + 26) % 26;
  var table = mixed.slice(shift) + mixed.slice(0, shift);
  return text.replace(/[a-zA-Z]/g, function (ch) {
    var isLower = ch >= 'a';
    var u = ch.toUpperCase();
    var res = decrypt ? A[table.indexOf(u)] : table[A.indexOf(u)];
    return isLower ? res.toLowerCase() : res;
  });
}

// 特里特米乌斯: 位移随字母序号递增 (tabula recta 对角线)
function trithemius(text, decrypt) {
  var count = 0;
  return text.replace(/[a-zA-Z]/g, function (ch) {
    var base = ch <= 'Z' ? 65 : 97;
    var shift = count++;
    return String.fromCharCode((ch.charCodeAt(0) - base + (decrypt ? -shift : shift) + 26 * 10) % 26 + base);
  });
}

// 乘法密码: 密文 = 明文 x 密钥 (mod 26), 密钥须与 26 互质
function modInverse(k) {
  for (var i = 1; i < 26; i++) if (k * i % 26 === 1) return i;
  return 1;
}
function multiplicative(text, k, decrypt) {
  var m = decrypt ? modInverse(k) : k;
  return text.replace(/[a-zA-Z]/g, function (ch) {
    var base = ch <= 'Z' ? 65 : 97;
    return String.fromCharCode((ch.charCodeAt(0) - base) * m % 26 + base);
  });
}

// 三分密码: 3x3x3 立方体 + 分组竖写横读 (Bifid 的三维版)
function trifid(text, key, period, decrypt) {
  var ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ+';
  var mixed = '';
  (key.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
    if (mixed.indexOf(ch) < 0) mixed += ch;
  });
  for (var i = 0; i < 27; i++) if (mixed.indexOf(ALPHA[i]) < 0) mixed += ALPHA[i];
  var cube = {}, inv = {};
  for (i = 0; i < 27; i++) {
    cube[mixed[i]] = [Math.floor(i / 9) + 1, Math.floor(i % 9 / 3) + 1, i % 3 + 1];
    inv[cube[mixed[i]].join('')] = mixed[i];
  }
  text = (text.toUpperCase().match(/[A-Z]/g) || []).join('');
  var out = '';
  for (var s = 0; s < text.length; s += period) {
    var group = text.slice(s, s + period), n = group.length;
    var digits = [];
    if (!decrypt) {
      var L = [], R = [], C = [];
      for (i = 0; i < n; i++) { var t = cube[group[i]]; L.push(t[0]); R.push(t[1]); C.push(t[2]); }
      digits = L.concat(R, C);
      for (i = 0; i < digits.length; i += 3) out += inv[digits.slice(i, i + 3).join('')];
    } else {
      for (i = 0; i < n; i++) digits = digits.concat(cube[group[i]]);
      for (i = 0; i < n; i++) out += inv['' + digits[i] + digits[n + i] + digits[2 * n + i]];
    }
  }
  return out;
}

// 虚无主义: Polybius 分数化后普通加法 (不取模)
function nihilist(text, squareKey, key, decrypt) {
  var A = 'ABCDEFGHIKLMNOPQRSTUVWXYZ';
  var mixed = '';
  (squareKey.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
    if (A.indexOf(ch) >= 0 && mixed.indexOf(ch) < 0) mixed += ch;
  });
  for (var i = 0; i < 25; i++) if (mixed.indexOf(A[i]) < 0) mixed += A[i];
  var square = {}, inv = {};
  for (i = 0; i < 25; i++) {
    square[mixed[i]] = [Math.floor(i / 5) + 1, i % 5 + 1];
    inv[(Math.floor(i / 5) + 1) * 10 + i % 5 + 1] = mixed[i];
  }
  var ks = [];
  (key.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
    if (square[ch]) ks.push(square[ch]);
  });
  if (!decrypt) {
    var out = [], count = 0;
    (text.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
      if (!square[ch]) return;
      var p = square[ch], k = ks[count++ % ks.length];
      out.push(p[0] * 10 + p[1] + k[0] * 10 + k[1]);
    });
    return out.join(' ');
  }
  var nums = text.trim().split(/\s+/).map(Number), dec = '';
  for (i = 0; i < nums.length; i++) {
    var k2 = ks[i % ks.length];
    dec += inv[nums[i] - (k2[0] * 10 + k2[1])];
  }
  return dec;
}

// ADFGX/ADFGVX: Polybius 分数化 + 列置换 (size=5 为 ADFGX, size=6 含数字)
function adfgvx(text, squareKey, transKey, size, decrypt) {
  var headers = size === 5 ? 'ADFGX' : 'ADFGVX';
  var alpha = size === 5 ? 'ABCDEFGHIKLMNOPQRSTUVWXYZ' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var mixed = '', i;
  (squareKey.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
    if (ch === 'J' && size === 5) ch = 'I';
    if (mixed.indexOf(ch) < 0 && alpha.indexOf(ch) >= 0) mixed += ch;
  });
  for (i = 0; i < alpha.length; i++) if (mixed.indexOf(alpha[i]) < 0) mixed += alpha[i];
  if (size === 6) {
    var digits = '1234567890', letters = 'ABCDEFGHIJ';
    for (i = 0; i < 10; i++) {
      var pos = mixed.indexOf(letters[i]) + 1;
      mixed = mixed.slice(0, pos) + digits[i] + mixed.slice(pos);
    }
  }
  var square = {}, inv = {};
  for (i = 0; i < mixed.length; i++) {
    square[mixed[i]] = headers[Math.floor(i / size)] + headers[i % size];
    inv[square[mixed[i]]] = mixed[i];
  }
  if (!decrypt) {
    var chars = text.toUpperCase().match(size === 5 ? /[A-Z]/g : /[A-Z0-9]/g) || [];
    if (size === 5) chars = chars.map(function (c) { return c === 'J' ? 'I' : c; });
    var frac = chars.map(function (c) { return square[c]; }).join('');
    return columnar(frac, transKey, false);
  }
  var f = columnar((text.toUpperCase().match(/[ADFGVX]/g) || []).join(''), transKey, true);
  var out = '';
  for (i = 0; i < f.length; i += 2) out += inv[f.slice(i, i + 2)];
  return out;
}

// 跳步: 环状置换, 每隔 step 取一个字母直到取完
function skip(text, step, decrypt) {
  var n = text.length;
  if (n < 2 || step % n === 0) return text;
  var visited = [], order = [], idx = 0, i, k;
  for (i = 0; i < n; i++) visited.push(false);
  while (order.length < n) {
    if (!visited[idx]) {
      visited[idx] = true; order.push(idx);
      idx = (idx + step) % n;
    } else {
      while (visited[idx]) idx = (idx + 1) % n;
    }
  }
  if (!decrypt) {
    var out = '';
    for (k = 0; k < n; k++) out += text[order[k]];
    return out;
  }
  var result = new Array(n);
  for (k = 0; k < n; k++) result[order[k]] = text[k];
  return result.join('');
}

// 恩尼格玛: 三转子 + 反射器, 含双跳步异常 (Enigma I / M3)
var ENIGMA_ROTORS = {
  'I':   ['EKMFLGDQVZNTOWYHXUSPAIBRCJ', 'Q'],
  'II':  ['AJDKSIRUXBLHWTMCQGZNPYFVOE', 'E'],
  'III': ['BDFHJLCPRTXVZNYEIWGAKMUSQO', 'V'],
  'IV':  ['ESOVPZJAYQUIRHXLNFTGKDCMWB', 'K'],
  'V':   ['VZBRGITYUPSDNHLXAWMJQOFECK', 'A']
};
var ENIGMA_REFLECTORS = {
  'A': 'EJMZALYXVBWFCRQUONTSPIKHGD',
  'B': 'YRUHQSLDPXNGOKMIEBFZCWVJAT',
  'C': 'FVPJIAOYEDRZXWGCTKUQSBNMHL'
};

// rotors: 空格分隔的从左到右转子名; 机器自反, 同一设置再跑一遍即解密
function enigma(text, rotorNames, reflector, positions, rings, plugboard) {
  var wires = [], invs = [], turns = [], pos = [], i;
  (rotorNames || 'I II III').trim().toUpperCase().split(/\s+/).forEach(function (name) {
    var spec = ENIGMA_ROTORS[name];
    if (!spec) return;
    var w = spec[0].split('').map(function (c) { return c.charCodeAt(0) - 65; });
    var inv = [];
    w.forEach(function (c, idx) { inv[c] = idx; });
    wires.push(w); invs.push(inv); turns.push(spec[1].charCodeAt(0) - 65);
  });
  if (!wires.length) return '';
  var fill = function (s) {
    s = (s || 'A').toUpperCase().replace(/[^A-Z]/g, '');
    while (s.length < wires.length) s += 'A';
    return s.slice(0, wires.length);
  };
  positions = fill(positions); rings = fill(rings);
  for (i = 0; i < wires.length; i++) {
    pos.push(((positions.charCodeAt(i) - 65) - (rings.charCodeAt(i) - 65) + 26) % 26);
  }
  var plug = {};
  var pairs = (plugboard || '').toUpperCase().replace(/[^A-Z]/g, '');
  for (i = 0; i + 1 < pairs.length; i += 2) {
    var a = pairs.charCodeAt(i) - 65, b = pairs.charCodeAt(i + 1) - 65;
    plug[a] = b; plug[b] = a;
  }
  var rw = ENIGMA_REFLECTORS[reflector] || ENIGMA_REFLECTORS.B;
  var n = wires.length;

  var stepFn = function () {
    if (pos[n - 2] === turns[n - 2]) {
      pos[n - 2] = (pos[n - 2] + 1) % 26;
      pos[n - 3] = (pos[n - 3] + 1) % 26;
    } else if (pos[n - 1] === turns[n - 1]) {
      pos[n - 2] = (pos[n - 2] + 1) % 26;
    }
    pos[n - 1] = (pos[n - 1] + 1) % 26;
  };

  var out = '';
  (text.toUpperCase().match(/[A-Z]/g) || []).forEach(function (ch) {
    stepFn();
    var code = ch.charCodeAt(0) - 65;
    code = plug.hasOwnProperty(code) ? plug[code] : code;
    for (i = n - 1; i >= 0; i--) code = (wires[i][(code + pos[i]) % 26] - pos[i] + 52) % 26;
    code = rw.charCodeAt(code) - 65;
    for (i = 0; i < n; i++) code = (invs[i][(code + pos[i]) % 26] - pos[i] + 52) % 26;
    code = plug.hasOwnProperty(code) ? plug[code] : code;
    out += String.fromCharCode(code + 65);
  });
  return out;
}

      card.append(input, key, shift,
        btnRow('加密', function () { out.textContent = keyedCaesar(input.value, key.value, toInt(shift.value, 1), false); }),
        btnRow('解密', function () { out.textContent = keyedCaesar(input.value, key.value, toInt(shift.value, 1), true); }), out);
    } },
  { name: '特里特米乌斯 Trithemius', desc: '逐字母位移递增的凯撒：第 1 个字母移 0 位、第 2 个移 1 位……即 tabula recta 的对角线。',
    render: function (card) {
      var input = el('textarea'), out = outBox();

    } },
  { name: '虚无主义 Nihilist', desc: '明文与密钥各经 Polybius 方阵转为两位数，普通加法（不取模）得数字密文，可能溢出为三位数。',
    render: function (card) {
      var input = el('textarea'), sk = el('input'), key = el('input'), out = outBox();
      sk.placeholder = '方阵密钥 (默认 zebras)'; sk.value = 'zebras';

    } },

    render: function (card) {

      size.placeholder = '尺寸 5 或 6 (默认 6)'; size.value = '6';
      card.append(input, sk, tk, size,
        btnRow('加密', function () { out.textContent = adfgvx(input.value, sk.value, tk.value, toInt(size.value, 6), false); }),
        btnRow('解密', function () { out.textContent = adfgvx(input.value, sk.value, tk.value, toInt(size.value, 6), true); }), out);
    } },
  { name: '跳步 Skip', desc: '从起点起每隔 step 位取一个字母，到尾部回绕继续直到取完，是一种环状置换。',
    render: function (card) {

    render: function (card) {

        btnRow('加密 / 解密', function () { out.textContent = enigma(input.value, rotors.value, 'B', pos.value, 'AAA', plug.value); }), out);
    } }
];

// ============ 渲染工具 ============
function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
function toInt(v, d) { var n = parseInt(v, 10); return isNaN(n) ? d : n; }
function outBox() { var e = el('div', 'out'); e.textContent = '结果…'; return e; }
function btnRow(label, fn) {
  var wrap = el('div', 'row'), b = el('button');
  b.textContent = label; b.onclick = function () { fn(b); };
  wrap.append(b); return wrap;
}
var root = document.getElementById('demos');
demos.forEach(function (d) {
  var card = el('div', 'card'), h = el('h3'), p = el('div', 'desc');
  h.textContent = d.name; p.textContent = d.desc;
  card.append(h, p); d.render(card); root.append(card);
});
